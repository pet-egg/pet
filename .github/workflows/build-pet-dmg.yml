name: Build Pet DMG

# 메뉴바 펫 앱(ConnorPet/)을 `cd ConnorPet && swift run` 과 동일하게 **모든 펫을 포함한
# 단일 앱**으로 빌드해 pet.app / pet.dmg 를 만드는 파이프라인. v* 태그 푸시로만 트리거되며
# 빌드 후 릴리스 생성 + Pages 배포까지 자동으로 이어진다. 예전에는 펫 하나를 골라 그 펫만
# 남기게 소스를 패치했지만, 지금은 메뉴바에서 12종을 모두 전환할 수 있는 기본 빌드를 그대로
# 배포한다. 산출물 이름은 전부 `pet` 로 고정한다.
on:
  push:
    tags:
      - 'v*'            # 예: git push origin v1.0.0 → 빌드 + 릴리스 + Pages 배포 자동

permissions:
  contents: read

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 버전은 git 태그(최신 태그)와 커밋 수로 계산하므로 전체 히스토리가 필요하다.
          # 기본 shallow 체크아웃은 태그가 없고 rev-list --count 도 1로 나온다.
          fetch-depth: 0

      - name: Build (release)
        run: |
          cd ConnorPet
          # 펫을 고르지 않는다 — 기본 availablePetSlugs(전체)를 그대로 빌드한다.
          swift build -c release

      - name: Generate app icon
        run: |
          cd ConnorPet
          # 아이콘은 assets/app-icon.png 하나로 고정(펫 무관).
          cp ../assets/app-icon.png /tmp/icon_master.png

          mkdir -p AppIcon.iconset
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$size" "$size" /tmp/icon_master.png --out "AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$double" "$double" /tmp/icon_master.png --out "AppIcon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Assemble pet.app bundle
        run: |
          cd ConnorPet
          APP="pet.app"
          EXE="pet"
          BUNDLE_ID="io.github.pet-egg.pet"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Frameworks"
          # 실행 파일명도 pet 으로 바꾼다(CFBundleExecutable 과 일치시켜야 함).
          cp .build/release/ConnorPet "$APP/Contents/MacOS/$EXE"
          # AppDelegate.swift의 resourceBundle이 Bundle.main.resourceURL(=이 경로)을
          # 먼저 찾아보도록 되어 있다 — SwiftPM 기본 accessor(Bundle.module)는 .app
          # 번들 루트에서 찾는데, 거기 두면 codesign이 "unsealed contents present in
          # the bundle root"로 서명 자체를 거부해서 quarantine 시 "손상됨" 오류가 남.
          # 리소스 번들 이름(ConnorPet_ConnorPet.bundle)은 SwiftPM 산출물이라 그대로 둔다.
          cp -R .build/release/ConnorPet_ConnorPet.bundle "$APP/Contents/Resources/ConnorPet_ConnorPet.bundle"
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"

          # Sparkle 자동 업데이트 임베드: 프레임워크를 Contents/Frameworks 로 넣고
          # 실행 파일에 @executable_path/../Frameworks rpath 를 건다. SwiftPM 이 남긴
          # rpath 는 러너의 빌드 경로(절대경로)라 배포본에서는 안 맞으므로 필요하다.
          cp -R .build/release/Sparkle.framework "$APP/Contents/Frameworks/Sparkle.framework"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP/Contents/MacOS/$EXE" || true

          # 버전은 git 태그(최신 태그)와 커밋 수로 계산한다. 태그가 없으면 0.0.0.
          #   CFBundleShortVersionString = 사람용 마케팅 버전(UI 노출)
          #   CFBundleVersion            = 커밋 수(단조 증가 → Sparkle 신·구 비교 기준)
          SHORT_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          SHORT_VERSION="${SHORT_VERSION#v}"
          [ -z "$SHORT_VERSION" ] && SHORT_VERSION="0.0.0"
          BUILD_NUMBER="$(git rev-list --count HEAD 2>/dev/null || echo 1)"
          echo "버전 $SHORT_VERSION (build $BUILD_NUMBER)"

          # 모든 펫이 든 단일 앱이므로 피드도 하나다: appcast.xml.
          # SUPublicEDKey 는 업데이트 검증용 EdDSA 공개키(공개라 커밋해도 안전). 짝이 되는
          # 개인키는 저장소에 없고, appcast 서명 스텝이 secrets 에서 받아 쓴다.
          FEED_URL="https://pet-egg.github.io/pet/appcast.xml"
          SPARKLE_PUBLIC_KEY="5zPY3WaXtB6g72hVacYErOpHAnHYAbCcwVGWjK1p8R4="

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$EXE</string>
              <key>CFBundleIdentifier</key>
              <string>$BUNDLE_ID</string>
              <key>CFBundleName</key>
              <string>pet</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$SHORT_VERSION</string>
              <key>CFBundleVersion</key>
              <string>$BUILD_NUMBER</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>SUFeedURL</key>
              <string>$FEED_URL</string>
              <key>SUPublicEDKey</key>
              <string>$SPARKLE_PUBLIC_KEY</string>
              <key>SUEnableAutomaticChecks</key>
              <false/>
          </dict>
          </plist>
          PLIST

          # swift build가 실행 파일 자체에 남긴 linker-signed ad-hoc 서명은 이렇게
          # 손으로 조립한 번들 구조(Info.plist/Resources)를 봉인하지 못해서 무효가 된다
          # (codesign -dv로 확인하면 "code has no resources but signature indicates
          # they must be present"). 그 상태로 배포하면 인터넷에서 받은 파일에 자동으로
          # 붙는 com.apple.quarantine 플래그와 맞물려 macOS가 "손상되었기 때문에 열 수
          # 없습니다"라며 아예 실행을 거부한다(휴지통으로 보내라는 안내까지 뜸).
          # 번들 전체를 다시 ad-hoc 서명해서 리소스까지 올바르게 봉인하면 이 오류가
          # 사라지고, 서명 자체가 Apple Developer ID는 아니라서(공증 스코프 밖) 정상적인
          # "확인되지 않은 개발자" Gatekeeper 경고로 바뀐다 — 이건 우클릭 → 열기로 넘어갈
          # 수 있는 정상 동작이다.
          codesign --force --deep --sign - "$APP"

      - name: Create pet.dmg
        run: |
          cd ConnorPet
          hdiutil create -volname "pet" -srcfolder "pet.app" -ov -format UDZO "pet.dmg"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-dmg
          path: ConnorPet/pet.dmg

      # Sparkle appcast 서명·생성. 자동 업데이트를 켜려면 저장소 Secret 에
      # SPARKLE_EDDSA_PRIVATE_KEY (generate_keys 로 만든 개인키, base64) 를 넣어야 한다.
      # 없으면 이 스텝은 조용히 건너뛰고 DMG 만 나온다.
      # 개인키는 Info.plist 에 박힌 SUPublicEDKey 와 반드시 짝이어야 한다.
      - name: Sign update & generate appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          cd ConnorPet
          if [ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]; then
            echo "::notice::SPARKLE_EDDSA_PRIVATE_KEY 시크릿이 없어 appcast 서명/생성을 건너뜁니다 (DMG 만 업로드)."
            exit 0
          fi
          BIN=".build/artifacts/sparkle/Sparkle/bin"
          mkdir -p appcast_out
          cp "pet.dmg" appcast_out/
          # 개인키는 stdin(--ed-key-file -)으로 넘겨 디스크에 남기지 않는다.
          # download-url-prefix + DMG 파일명(pet.dmg) = 최종 다운로드 URL:
          #   https://github.com/pet-egg/pet/releases/latest/download/pet.dmg
          # → 그 릴리스에 pet.dmg 를 올리면 된다.
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | "$BIN/generate_appcast" appcast_out \
            --ed-key-file - \
            --download-url-prefix "https://github.com/pet-egg/pet/releases/latest/download/"
          # generate_appcast 는 앱 Info.plist 의 SUFeedURL 파일명(= appcast.xml)을 그대로
          # 따서 파일을 만든다. 실제 생성된 유일한 .xml 을 집어서 최상위로 꺼낸다.
          GENERATED="$(ls appcast_out/*.xml | head -1)"
          mv "$GENERATED" "appcast.xml"
          echo "생성됨: appcast.xml (원본: $GENERATED)"

      - name: Upload appcast artifact
        if: ${{ hashFiles('ConnorPet/appcast.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pet-appcast
          path: ConnorPet/appcast.xml

      - name: Job summary
        run: |
          {
            echo "## pet.dmg"
            echo ""
            echo "모든 펫(12종)이 든 단일 앱입니다 — 메뉴바에서 전환하세요."
            echo ""
            echo "코드서명/공증(notarization) 없이 ad-hoc 서명만 했습니다. 다운로드한 파일은 quarantine 플래그가 붙어 있어서, 그대로 더블클릭하면 macOS(특히 Apple Silicon)가 아무 안내도 없이 실행을 막고 앱을 휴지통으로 옮겨버립니다(우클릭 → 열기로도 안 열림). 다음을 터미널에서 실행한 뒤 여세요:"
            echo ""
            echo '```sh'
            echo "xattr -d com.apple.quarantine /path/to/pet.app"
            echo "open /path/to/pet.app"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 아래 두 잡은 태그 푸시(refs/tags/v*)일 때만 실행된다. 트리거가 v* 태그뿐이라
  #    사실상 항상 도는 잡이지만, 안전장치로 ref 조건을 그대로 둔다. ──

  # 릴리스 생성 + pet.dmg 업로드. "latest" 릴리스가 이 태그가 되므로
  # appcast 의 enclosure(releases/latest/download/pet.dmg)와 URL 이 일치한다.
  release:
    needs: build-dmg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download pet.dmg
        uses: actions/download-artifact@v4
        with:
          name: pet-dmg
          path: dist
      - name: Create release & upload pet.dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 이미 있는 태그면 create 가 실패 → 그때는 asset 만 덮어쓴다(--clobber).
          gh release create "$GITHUB_REF_NAME" dist/pet.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Sparkle 자동 업데이트 지원 빌드 ($GITHUB_REF_NAME)" \
            --latest \
          || gh release upload "$GITHUB_REF_NAME" dist/pet.dmg --clobber --repo "$GITHUB_REPOSITORY"

  # 서명된 appcast.xml 을 GitHub Pages 로 배포 → https://pet-egg.github.io/pet/appcast.xml
  # 사전 준비: 저장소 Settings › Pages › Source 를 "GitHub Actions" 로 설정해 둘 것.
  # appcast 는 SPARKLE_EDDSA_PRIVATE_KEY 시크릿이 있어야 생성되므로, 시크릿이 없으면
  # 아티팩트가 없어 이 잡은 실패한다(= 릴리스에는 서명 키가 필수라는 신호).
  publish-appcast:
    needs: build-dmg
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download appcast.xml
        uses: actions/download-artifact@v4
        with:
          name: pet-appcast
          path: site
      - name: Prepare site (.nojekyll)
        run: touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
